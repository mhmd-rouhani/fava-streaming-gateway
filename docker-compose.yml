services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      # Optional direct access for debugging (API + console)
      - "9000:9000"
      - "9001:9001"
    networks:
      - fava

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-120}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-30}
    depends_on:
      - minio
    # Backend retries MinIO connectivity on boot (see src/index.js).
    # الزامات: حداکثر حافظه بک‌اند ۱۵۰ مگابایت
    mem_limit: 150m
    deploy:
      resources:
        limits:
          memory: 150M
    networks:
      - fava
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api
    depends_on:
      - backend
    networks:
      - fava
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - fava
    restart: unless-stopped

volumes:
  minio_data:

networks:
  fava:
    driver: bridge
